name: Build Windows binary

on:
    push:
      branches: [ "master" ]
    pull_request:
      branches: [ "master" ]
env:
  CARGO_TERM_COLOR: always
  # rust-sfml 0.24 does not use a prebuilt SFML: it builds SFML and libflac from source
  # with cmake. There is no Visual Studio on the runner - cc and cmake both fail to find
  # one - so the whole build goes through the MinGW-w64 GCC installed below, and cmake
  # drives it with Ninja instead of a Visual Studio generator.
  CMAKE_GENERATOR: Ninja
jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The msvcrt flavour (mingw64, not ucrt64): that is the one Rust's
      # x86_64-pc-windows-gnu target uses, and the one rust-sfml ships extlibs for.
      - name: Install the MinGW-w64 toolchain
        run: |
          C:\msys64\usr\bin\pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add the Windows GNU target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Show the toolchain
        run: |
          gcc --version
          cmake --version
          ninja --version

      - name: Build for Windows
        run: cargo build --release --target x86_64-pc-windows-gnu --verbose

      # A GCC-built exe imports the MinGW C++ runtime, which a plain Windows box does
      # not have. openal32.dll is still on you - SFML links OpenAL dynamically whatever
      # the toolchain, exactly as it did before, and the crate does not ship the DLL.
      - name: Package artifacts
        run: |
          mkdir artifacts
          cp target/x86_64-pc-windows-gnu/release/sfml_example.exe artifacts/
          foreach ($dll in "libstdc++-6.dll", "libwinpthread-1.dll", "libgcc_s_seh-1.dll") {
            $src = "C:\msys64\mingw64\bin\$dll"
            if (Test-Path $src) { cp $src artifacts\ }
          }
          dir artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin
          path: artifacts/
